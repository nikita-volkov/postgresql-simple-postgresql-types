name: Main branch maintenance

on:
  push:
    branches: [main, master]

# Shares a group with release.yaml so a release run can't race the format
# job's auto-commit to master (which was causing non-fast-forward push failures).
concurrency:
  group: master-write-lock
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-docs:
    uses: nikita-volkov/haskell-hackage-lib-github-actions-workflows/.github/workflows/deploy-docs-to-github-pages.yaml@v4
    secrets: inherit

  format:
    uses: nikita-volkov/haskell-hackage-lib-github-actions-workflows/.github/workflows/format.yaml@v4
    secrets: inherit

  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
